<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Flipkart</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-left">

            <a href="index.html" class="logo">
                Flipkart
                <span>Explore <b>Plus</b> ✨</span>
            </a>

        </div>

        <div class="search-box">
            <span>⌕</span>

            <input
                type="text"
                placeholder="Search for Products, Brands and More"
            >
        </div>

        <div class="nav-right">

            <a href="index.html" class="home-btn">
                Home
            </a>

            <a href="cart.html" class="cart">
                🛒 Cart
            </a>

        </div>

    </nav>


    <!-- LOGIN -->

    <main class="login-page">

        <div class="login-container">

            <!-- LEFT -->

            <div class="login-left">

                <h1>Login</h1>

                <p>
                    Get access to your Orders,
                    Wishlist and Recommendations
                </p>

                <div class="login-icon">
                    🛒
                </div>

            </div>


            <!-- RIGHT -->

            <div class="login-right">

                <form>

                    <div class="input-box">

                        <input
                            type="text"
                            id="email"
                            placeholder=" "
                            required
                        >

                        <label for="email">
                            Enter Email / Mobile number
                        </label>

                    </div>


                    <div class="input-box">

                        <input
                            type="password"
                            id="password"
                            placeholder=" "
                            required
                        >

                        <label for="password">
                            Enter Password
                        </label>

                    </div>


                    <div class="forgot">

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <p class="terms">

                        By continuing, you agree to Flipkart's

                        <a href="#">
                            Terms of Use
                        </a>

                        and

                        <a href="#">
                            Privacy Policy
                        </a>

                    </p>


                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Login
                    </button>


                    <div class="or">

                        <span></span>

                        <b>OR</b>

                        <span></span>

                    </div>


                    <button
                        type="button"
                        class="otp-btn"
                    >
                        Request OTP
                    </button>


                    <p class="new-user">

                        New to Flipkart?

                        <a href="#">
                            Create an account
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-links">

            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
            <a href="#">Help</a>

        </div>

        <p>
            © 2026 Flipkart Clone
        </p>

    </footer>

</body>

</html>
